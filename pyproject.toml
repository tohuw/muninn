[project]
name = "muninn-console"
version = "2026.08.12.1"
description = "A local-only console for AI agent history: search, correlate and resume past sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ron Scott-Adams" }]
keywords = ["claude", "codex", "transcripts", "search", "agents", "history"]

# Deliberately small, mirroring Huginn. The archive is stdlib sqlite3/FTS5;
# semantic search is optional and lives in the [semantic] extra so the default
# install has no ML surface at all.
#
# corvidae is the shared raven package (tohuw/huginn#42): stdlib-only, zero
# dependencies of its own, so adding it costs the install nothing measurable.
# Muninn consumes its login-agent seam rather than owning a second copy of
# launchd/systemd/Run-key handling — see muninn/agent_install.py and
# docs/specs/010-daemon.md, "Follow-up seam". The range is CalVer-year
# compatible and pinned the same way Huginn pins it: corvidae promises that
# every 2026.* release is compatible with every other, and that a breaking
# change waits for the next year component. Widening past <2027 would silently
# accept the release that is allowed to break us.
dependencies = [
    "corvidae>=2026.8.1,<2027",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
# Local, offline embeddings. Not installed by default: it pulls model weights,
# which is a governance problem for some distributions.
# See .valholl/articles/model-policy-chokepoint.md
semantic = [
    "numpy>=2.0",
    "mlx-embeddings>=0.0.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

# The console (unbuilt). fastapi and uvicorn were declared as *runtime*
# dependencies in anticipation of it and no module ever imported them — spec 009
# recorded that at the time, and it stayed true: `muninn serve` answers
# `/api/menu` from stdlib `http.server` (muninn/ravenserve.py), deliberately, so
# ingest never pays for a menubar.
#
# Moved here rather than deleted. Deleting would lose the recorded intent;
# leaving them in `dependencies` made every `uv sync` install FastAPI, starlette
# and pydantic to satisfy nothing — a default install carrying a web framework
# it does not import is the same kind of claim-without-substance the README was
# just corrected for. When the console lands it moves back, or this extra
# becomes how you install it.
console = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
muninn = "muninn.cli:main"
muninn-hook = "muninn.hooks.cli:main"

[project.urls]
Homepage = "https://github.com/tohuw/muninn"
Issues = "https://github.com/tohuw/muninn/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muninn"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Intentionally small: correctness rules, not style opinions.
select = ["E", "F", "W"]
ignore = ["E702"]
